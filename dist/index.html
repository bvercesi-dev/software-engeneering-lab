<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind CSS com Flexbox</title>
  <link href="./output.css" rel="stylesheet">
</head>

<body>
  <!-- Gradient -->
  <section class="bg-linear-to-r from-green-800 to-gray-200 p-6 text-gray-900">
    <h1 class="text-3xl font-bold underline">
      Introdução Tailwind CSS
    </h1>
    <p class="mt-3 text-lg">Lorem ipsum dolor sit amet</p>
  </section>

  <br><br>

  <!-- Cards -->
<section class="p-6 text-gray-900" style="background-image: linear-gradient(to right, #166534, #e5e7eb);">
    <a href="" class="border-2 border-slate-200 rounded-tl-lg rounded-tr-lg overflow-hidden">
      <img src="./images/goreme-downtown-scavenger-hunt_large.jpg" alt="Cidade da Turquia com passeio de balões" class="w-3/4" class="h-full">
      <div class="flex items-center flex-col my-5 gap-4 p-2">
        <h3 class="font-bold text-slate-700 text-2xl">Göreme</h3>
        <p class="font-bold text-slate-500">Português disponível - 03 diárias</p>
        <p class="font-bold text-2xl text-rose-700">R$ 7.800</p>
      </div>
    </a>

    <a href="" class="border-2 border-slate-200 rounded-tl-lg rounded-tr-lg overflow-hidden">
      <img src="./images/IhlaraValley.jpg" alt="Segunda cidade da Turquia" class="w-3/4" class="h-full">
      <div class="flex items-center flex-col my-5 gap-4 p-2">
        <h3 class="font-bold text-slate-700 text-2xl">Ihlara</h3>
        <p class="font-bold text-slate-500">Português disponível - 04 diárias</p>
        <p class="font-bold text-2xl text-rose-700">R$ 8.700</p>
      </div>
    </a>

    <a href="" class="border-2 border-slate-200 rounded-tl-lg rounded-tr-lg overflow-hidden">
      <img src="./images/Soganli_01.jpg" alt="Terceira cidade da Turquia" class="w-3/4" class="h-full">
      <div class="flex items-center flex-col my-5 gap-4 p-2">
        <h3 class="font-bold text-slate-700 text-2xl">Soganli</h3>
        <p class="font-bold text-slate-500">Português disponível - 05 diárias</p>
        <p class="font-bold text-2xl text-rose-700">R$ 9.800</p>
      </div>
    </a>
  </section>
</body>
</html>
